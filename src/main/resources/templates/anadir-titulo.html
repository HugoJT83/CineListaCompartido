<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>CineLista - Anadir titulo</title>
    <th:block th:replace="~{fragments/cabecera :: comunes}"></th:block>
</head>

<body>

    <div th:replace="~{fragments/nav :: nav}"></div>

    <!--
  TODO:
  El formulario de abajo tiene solo el campo "titulo" a proposito. Falta
  por vuestra parte anadir: genero, plataforma, estado y valoracion,
  colocando el boton de guardar al final, eligiendo el control html5 mas
  adecuado para cada campo (checkbox, radio, select, etc.) y maquetandolo
  con el editor visual + Bootstrap.

  El envio ya esta conectado: hace POST a /anadir-titulo y el controlador

  dar estilo y hacer formulario con funciones.

    <h1>Anadir titulo</h1>

    <!--<form th:action="@{/anadir-titulo}" th:object="${pelicula}" method="post">
    <label>Titulo: <input type="text" th:field="*{titulo}" required></label>
    <button type="submit">Guardar</button>
</form>-->

    <div class="cine-container">
        <h1 class="cine-titulo-seccion">Añadir título</h1>

        <form th:action="@{/anadir-titulo}" th:object="${pelicula}" method="post" class="cine-form">

            <!-- Campo: Título -->
            <div class="cine-grupo-campo">
                <label for="titulo" class="cine-label">Título:</label>
                <input type="text" id="titulo" class="cine-input" th:field="*{titulo}" placeholder="Ej. Inception"
                    required>
            </div>

            <!-- Campo: Género -->
            <div class="cine-grupo-campo">
                <label for="genero" class="cine-label">Género:</label>
                <select id="genero" class="cine-select" th:field="*{genero}" required>
                    <option value="">Selecciona un género...</option>
                    <option value="Acción">Acción</option>
                    <option value="Comedia">Comedia</option>
                    <option value="Drama">Drama</option>
                    <option value="Ciencia Ficción">Ciencia Ficción</option>
                    <option value="Terror">Terror</option>
                    <option value="Animación">Animación</option>
                </select>
            </div>

            <!-- Campo: Plataforma -->
            <div class="cine-grupo-campo">
                <label for="plataforma" class="cine-label">Plataforma:</label>
                <input type="text" id="plataforma" class="cine-input" th:field="*{plataforma}"
                    placeholder="Ej. Netflix, HBO, Cine..." required>
            </div>

            <!-- Campo: Estado -->
            <div class="cine-grupo-campo">
                <label class="cine-label">Estado:</label>
                <div class="cine-radio-grupo">
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" id="estadoVista" th:field="*{estado}" value="vista"
                            required>
                        <label class="form-check-label" for="estadoVista">Vista</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" id="estadoPendiente" th:field="*{estado}"
                            value="pendiente" required>
                        <label class="form-check-label" for="estadoPendiente">Pendiente</label>
                    </div>
                </div>
            </div>

            <!-- Campo: Valoración -->
            <div class="cine-grupo-campo">
                <label for="valoracion" class="cine-label">Valoración (0 - 10):</label>
                <input type="number" id="valoracion" class="cine-input" th:field="*{valoracion}" min="0" max="10"
                    value="0" required>
                <div class="cine-form-text">Introduce un valor numérico entero entre 0 y 10.</div>
            </div>

            <!-- Botón de guardar -->
            <div class="cine-btn-contenedor">
                <button type="submit" class="cine-btn-guardar">Guardar</button>
            </div>

        </form>
    </div>
</body>

</html>
