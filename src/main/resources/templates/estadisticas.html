<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>CineLista - Estadisticas</title>
    <th:block th:replace="~{fragments/cabecera :: comunes}"></th:block>
    <th:block th:replace="~{fragments/cabecera :: datatables}"></th:block>
    <th:block th:replace="~{fragments/cabecera :: datatables-buttons}"></th:block>
</head>

<body>

    <div th:replace="~{fragments/nav :: nav}"></div>

    <h1 class="h-milista">Estadisticas</h1>

    <!--
  TODO:
  1) Comprobar jQuery y DataTables (CDN o local) ya agregadas
  2) Inicializad DataTables sobre la tabla de abajo con la opcion "ajax"
     apuntando a GET /api/estadisticas (endpoint que crearéis vosotros
     en el controlador EstadisticasController).
  3) Id completando: buscador, footerCallback con el total, columna con
     barra grafica, boton de exportar a CSV con nombre propio.
-->

    <table id="tabla-estadisticas">
        <thead>
            <tr>
                <th>Titulo</th>
                <th>Genero</th>
                <th>Taquilla</th>
                <th>Nota</th>
                <th>Nota (Gráfico)</th>
            </tr>
        </thead>
        <tbody>
            <!-- Las filas las rellenara DataTables via ajax -->
        </tbody>
        <tfoot>
            <tr>
                <th></th>
                <th></th>
                <th></th>
                <th></th>
                <th></th>
            </tr>
        </tfoot>
    </table>

    <script>
        $(document).ready(function () {
            $('#tabla-estadisticas').DataTable({
                ajax: {
                    url: '/api/estadisticas',
                    dataSrc: ''
                },
                searching: true,
                dom: 'Bfrtip',
                buttons: [
                    {
                        extend: 'csvHtml5',
                        text: 'Exportar a CSV',
                        filename: 'estadisticas_de_peliculas'
                    }
                ],
                columns: [
                    { data: 'titulo' },
                    { data: 'genero' },
                    { data: 'taquilla' },
                    { data: 'nota' },
                    {
                        data: 'nota',
                        render: function (data, type, row) {
                            if (type !== 'display') return data;
                            const maxNota = 10;
                            const pct = Math.round((data / maxNota) * 100);
                            return `<div class="barra-datos" style="width:${pct}%">${data}</div>`;
                        }
                    }
                ],
                footerCallback: function (row, data, start, end, display) {
                    var api = this.api();

                    // Función auxiliar para asegurar que los datos son numéricos
                    var intVal = function (i) {
                        return typeof i === 'string' ?
                            i.replace(/[\$,]/g, '') * 1 :
                            typeof i === 'number' ?
                                i : 0;
                    };

                    // Sumar los valores de la columna de taquilla (índice 2) para la página actual
                    var total = api
                        .column(2, { page: 'current' })
                        .data()
                        .reduce(function (a, b) {
                            return intVal(a) + intVal(b);
                        }, 0);

                    // Mostrar el total en el elemento <footer> de la columna 2
                    $(api.column(2).footer()).html(total);
                }
            });
        });
    </script>

</body>

</html>
